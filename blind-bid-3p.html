<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0a0b0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>数字博弈</title>
<style>
:root{
  --bg:#0a0b0f;
  --bg-glow:#12141a;
  --txt:rgba(255,255,255,.75);      /* 正文：不低于 .75 */
  --sub:rgba(255,255,255,.60);      /* 次要：标题 / 表头，不低于 .60 */
  --num:#ffffff;                    /* 关键数字：纯白 */
  --card-bg:rgba(255,255,255,.04);
  --card-line:rgba(255,255,255,.12);
  --card-line-lead:rgba(255,255,255,.50);
  --chip-bg:rgba(255,255,255,.04);
  --chip-line:rgba(255,255,255,.10);
  --line2:rgba(255,255,255,.06);    /* 仅分隔线可用这么淡 */
  --inset-hi:inset 0 1px 0 rgba(255,255,255,.06);   /* 卡片顶部的高光线 */
  --gap:24px;
  --me-h:232px;   /* 固定中间区：你的卡 + 提示 + 按钮（卡↔按钮 距离因此恒定） */
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{
  margin:0;height:100%;overscroll-behavior:none;
  /* 近黑底 + 极淡径向渐变，中心略亮、边缘略暗 */
  background:radial-gradient(circle at 50% 30%,var(--bg-glow) 0%,var(--bg) 70%);
  color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",Roboto,sans-serif;
  display:flex;justify-content:center;overflow:hidden;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  user-select:none;-webkit-user-select:none;touch-action:manipulation;
}
html::-webkit-scrollbar,body::-webkit-scrollbar{display:none;width:0;height:0}
#app{
  width:100%;max-width:520px;height:100vh;height:100dvh;
  display:flex;flex-direction:column;gap:var(--gap);
  padding:max(20px,env(safe-area-inset-top)) 20px max(20px,env(safe-area-inset-bottom));
  /* 正常屏幕靠 flex 铺满一屏（不滚动）；极矮屏才退化为整页滚动，滚动条隐藏 */
  overflow-y:auto;scrollbar-width:none;-ms-overflow-style:none;
}
#app::-webkit-scrollbar{display:none;width:0;height:0}

/* ---------- 标题 ---------- */
.head{display:flex;align-items:center;gap:12px;flex:none}
.title{flex:1;margin:0;font-size:13px;line-height:14px;font-weight:400;letter-spacing:6px;color:var(--sub)}
.round{font-size:11.5px;line-height:14px;letter-spacing:1px;color:var(--num);
  font-variant-numeric:tabular-nums;white-space:nowrap}
.ghost{background:none;border:1px solid var(--card-line);color:var(--sub);border-radius:8px;
  padding:6px 12px;font:inherit;font-size:11px;line-height:14px;letter-spacing:1px;
  transition:border-color .2s ease,color .2s ease,background .2s ease}
.ghost:active{border-color:var(--card-line-lead);color:var(--num)}

/* ---------- 三角形：🔴 左上 / 🔵 右上 / 你 下方居中 ---------- */
.tri{flex:1 1 auto;display:flex;flex-direction:column;padding-top:24px}  /* 给气泡留空隙 */
.tri-top{display:flex;justify-content:space-between;align-items:flex-start}
.tri-me{display:flex;justify-content:center;margin-top:auto;padding-top:12px}
/* 三角区的空白全部交给 margin-top:auto：屏越高，两个 AI 与你之间拉得越开 */
/* 固定高度的中间区：玩家卡 / 提示 / 按钮的位置永远不变 */
.me-block{width:100%;max-width:280px;height:var(--me-h);
  display:flex;flex-direction:column;align-items:center;gap:16px}

/* ---------- 玩家卡：三张完全同尺寸同结构，只是摆在三角形三个顶点 ---------- */
.pcard{
  --cw:120px;
  position:relative;width:var(--cw);
  display:flex;flex-direction:column;align-items:center;gap:16px;   /* 分数 ↔ 选择方块 16px */
  padding:12px 12px 10px;
  background:var(--card-bg);border:1px solid var(--card-line);border-radius:10px;
  box-shadow:var(--inset-hi);                                       /* 顶部一条几乎看不见的高光线 */
  /* 领先者切换：边框/发光 0.6s（配合动画5的 0.15s 延迟做"权杖交接"） */
  transition:border-color .6s ease,box-shadow .6s ease,background .3s ease;
}
.pcard.lead{                                   /* 只提亮边框 + 极淡外发光，不加粗不变色 */
  border-color:var(--card-line-lead);
  box-shadow:var(--inset-hi),0 0 0 1px rgba(255,255,255,.05),0 0 26px -8px rgba(255,255,255,.22);
}
.pcard.zero{background:rgba(255,255,255,.02);border-color:rgba(255,255,255,.08)}
.pcard.zero .pname,.pcard.zero .pscore{color:rgba(255,255,255,.40)}
.pcard.zero .face.back{background:rgba(255,255,255,.03);color:rgba(255,255,255,.40);
  border-color:var(--chip-line)}

/* 名字 ↔ 分数 8px */
.pinfo{display:flex;flex-direction:column;align-items:center;gap:8px}
.pname{font-size:11px;line-height:14px;letter-spacing:2px;color:var(--txt);white-space:nowrap}
.pscore{font-size:28px;font-weight:200;letter-spacing:1px;color:var(--num);
  line-height:28px;font-variant-numeric:tabular-nums}
.pscore.pop{animation:scoreIn .3s cubic-bezier(.2,.8,.2,1) both}
/* 得分浮现：淡入 + 上移 4px */
@keyframes scoreIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
@keyframes softIn{from{opacity:0}to{opacity:1}}

.slot{perspective:560px;height:44px;width:100%;display:flex;align-items:center;justify-content:center}
/* 亮牌翻转：rotateX，0.4s，翻完轻微停顿（JS 侧等 700ms 再走下一步） */
.flip{position:relative;width:44px;height:44px;transform-style:preserve-3d;
  transition:transform .4s cubic-bezier(.2,.8,.2,1)}
.flip.revealed{transform:rotateX(180deg)}
/* 选择方块：极淡描边，比背景略亮一点点 */
.face{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:8px;
  background:var(--chip-bg);border:1px solid var(--chip-line);
  font-size:18px;font-weight:300;font-variant-numeric:tabular-nums}
.face.front{color:var(--sub)}
.face.front.txt{font-size:9.5px;letter-spacing:0}
.face.back{transform:rotateX(180deg);background:rgba(255,255,255,.07);
  color:var(--num);font-weight:400}

/* 对话气泡：安静的浅色小药丸，不抢戏 */
.bubble{
  position:absolute;left:50%;top:-24px;z-index:6;pointer-events:none;
  background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.20);
  color:var(--num);font-size:10px;font-weight:400;letter-spacing:.5px;
  padding:3px 8px;border-radius:999px;white-space:nowrap;
  opacity:0;transform:translate(-50%,4px);
  transition:opacity .2s ease,transform .2s ease;
}
.bubble.show{opacity:1;transform:translate(-50%,0)}

/* 动画4：撞车反馈，可删除 ── 同数者（即本轮 0 分者）的选择方块左右抖 2px 一次，不持续 */
@keyframes shake{0%,100%{transform:rotateX(180deg) translateX(0)}
  25%{transform:rotateX(180deg) translateX(-2px)}75%{transform:rotateX(180deg) translateX(2px)}}
.pcard.zero .flip{animation:shake .2s .5s both}

/* ---------- 提示 + 按钮（固定高度，位置不随底部抽屉变化） ---------- */
.hint{text-align:center;font-size:12px;line-height:18px;height:18px;letter-spacing:1.5px;
  color:var(--txt);white-space:nowrap;flex:none}
.hint.dim{color:var(--sub)}
/* 回合切换：提示文字淡出旧的、淡入新的（不跳变） */
.hint.swap{animation:hintIn var(--hint-dur,.25s) ease both}
@keyframes hintIn{from{opacity:0}to{opacity:1}}

.btns{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;
  width:min(100%,260px);height:50px;margin:0 auto;flex:none}
.pick{height:100%;border-radius:9px;border:1px solid var(--card-line);background:var(--card-bg);
  color:var(--txt);font:inherit;font-size:18px;font-weight:300;
  transition:border-color .2s ease,background .2s ease,color .2s ease,opacity .2s ease}
.pick.sel{border-color:var(--card-line-lead);background:rgba(255,255,255,.08);color:var(--num)}
.pick:not(:disabled):active{background:rgba(255,255,255,.12)}   /* 只变底色，不缩放 */
.pick:disabled{opacity:.25}

/* 动画6：加赛轮仪式感，可删除 ── 整块界面上下一沉再回位（无闪烁、无颜色） */
.tieritual{animation:tieSink .6s ease both}
@keyframes tieSink{0%,100%{transform:translateY(0)}50%{transform:translateY(4px)}}

/* =====================================================================
 * 可选动效（纯装饰）：下面每一块都可以整块注释掉，删掉不影响任何功能与布局
 * ===================================================================== */

/* 动画1：思考中，可删除 ── AI 卡片下方三个小点同时明暗（0.8s 循环，无波纹） */
.pcard .think{display:none;position:absolute;left:50%;bottom:-9px;transform:translateX(-50%);gap:3px}
.pcard.thinking .think{display:flex}
.think i{width:3px;height:3px;border-radius:50%;background:var(--txt);opacity:.25;
  animation:dotPulse .8s ease-in-out infinite}
@keyframes dotPulse{0%,100%{opacity:.25}45%{opacity:.95}}

/* 动画2：公开选择后的张力，可删除 ── 追赶者卡片下沉 1px 再回位 */
.pcard.sink{animation:sink .3s ease .25s both}
@keyframes sink{0%,100%{transform:translateY(0)}45%{transform:translateY(1px)}}

/* 动画3：亮牌前的呼吸，可删除 ── 未揭晓的选择方块透明度 0.25↔0.4 循环 */
#app.tense .face.front{animation:breathe 1s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.4}50%{opacity:.25}}

/* 动画5：领先者交换（权杖交接），可删除 ── 旧领先者立即淡出，新领先者延迟 0.15s 淡入 */
.pcard.baton{transition:border-color .6s ease .15s,box-shadow .6s ease .15s,background .3s ease}

/* 动画7：结算时刻，可删除 ── 获胜方边框呼吸 2 次后停在高亮；落败方透明度略降 */
.pcard.winpulse{animation:winPulse .6s ease-in-out 2 both}
@keyframes winPulse{
  0%,100%{border-color:var(--card-line-lead);
    box-shadow:var(--inset-hi),0 0 0 1px rgba(255,255,255,.05),0 0 26px -8px rgba(255,255,255,.22)}
  50%{border-color:rgba(255,255,255,.92);
    box-shadow:var(--inset-hi),0 0 0 1px rgba(255,255,255,.10),0 0 34px -4px rgba(255,255,255,.40)}}
.pcard.lose{opacity:.62}

/* ===================== 可选动效到此结束 ===================== */

/* ---------- 底部两个常显区块：高度由「游戏说明」内容决定，两者永远等高 ---------- */
.folds{display:flex;gap:12px;flex:none;align-items:stretch}
.fold{flex:1 1 0;min-width:0;display:flex;flex-direction:column;
  overflow:hidden;background:rgba(255,255,255,.02);
  border:1px solid var(--card-line);border-radius:9px;box-shadow:var(--inset-hi)}
.foldhead{flex:none;height:26px;display:flex;align-items:center;justify-content:center;
  font-size:10.5px;letter-spacing:1.5px;color:var(--sub);
  border-bottom:1px solid var(--line2)}
.foldbody{min-height:0;scrollbar-width:none;-ms-overflow-style:none}
.foldbody::-webkit-scrollbar{display:none;width:0;height:0}

/* 游戏说明：行距与内边距适中，高度由 5 行内容自然决定 */
#foldHelp .foldbody{flex:1 1 auto}
.help{padding:14px;font-size:10.5px;line-height:1.75;color:var(--txt);letter-spacing:.2px}
.help .no{color:var(--sub);margin-right:4px}

/* 历史记录：内容绝对定位，不参与撑高 → 外框高度完全跟随游戏说明 */
#foldHist{position:relative}
#foldHist .foldbody{position:absolute;left:0;right:0;top:26px;bottom:0;
  display:flex;flex-direction:column;overflow:hidden}
.histtop{flex:none;padding:12px 0 0}
.histscroll{flex:1 1 auto;min-height:0;overflow-y:auto;padding:0 0 12px;
  scrollbar-width:none;-ms-overflow-style:none}
.histscroll::-webkit-scrollbar{display:none;width:0;height:0}
table.hist{width:100%;table-layout:fixed;border-collapse:collapse;
  font-size:10.5px;font-variant-numeric:tabular-nums}
table.hist th{height:24px;line-height:24px;padding:0;background:none;
  color:var(--sub);font-size:9.5px;font-weight:400;letter-spacing:.5px;text-align:center}
table.hist td{height:24px;line-height:24px;padding:0;text-align:center;color:var(--txt);
  border-bottom:1px solid var(--line2)}
table.hist tbody tr:last-child td{border-bottom:none}
table.hist tbody tr.new td{color:var(--num)}
/* 新行：从下方 8px 淡入滑入，旧行随之自然上移 */
@keyframes rowIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
table.hist tbody tr.new{animation:rowIn .3s cubic-bezier(.2,.8,.2,1) both}

/* 桌面端 hover：边框 .12 → .25，底色 .04 → .07 */
@media (hover:hover){
  .pick:not(:disabled):hover{border-color:rgba(255,255,255,.25);background:rgba(255,255,255,.07)}
  .pick:not(:disabled):hover,
  .ghost:hover{border-color:rgba(255,255,255,.25)}
  .ghost:hover{background:rgba(255,255,255,.07);color:var(--num)}
}

/* 矮屏：只收屏幕外边距与三角区顶部留白，卡片与说明区尺寸一律不动 */
@media (max-height:700px){
  #app{padding-top:16px;padding-bottom:16px}
  .tri{padding-top:20px}
}
</style>
</head>
<body>
<div id="app">
  <div class="head">
    <h1 class="title">数字博弈</h1>
    <span class="round" id="roundLabel">第 1 轮</span>
    <button class="ghost" id="btnRestart">重开</button>
  </div>

  <!-- 三角形：🔴 左上、🔵 右上、你 下方居中 -->
  <div class="tri">
    <div class="tri-top">
      <div id="slotRed"></div>
      <div id="slotBlue"></div>
    </div>

    <!-- 固定高度的中间区：底部抽屉开合不会影响这里的位置 -->
    <div class="tri-me">
      <div class="me-block">
        <div id="slotMe"></div>
        <div class="hint" id="hint">准备开始</div>
        <div class="btns" id="btns">
          <button class="pick" data-n="1">1</button>
          <button class="pick" data-n="2">2</button>
          <button class="pick" data-n="3">3</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 底部两个常显区块：各占一半、外形等高，超出只在框内滚动 -->
  <div class="folds">
    <div class="fold" id="foldHelp">
      <div class="foldhead">游戏说明</div>
      <div class="foldbody">
        <div class="help">
          <div><span class="no">①</span>三人各选 1 / 2 / 3</div>
          <div><span class="no">②</span>全不同：各得所选分</div>
          <div><span class="no">③</span>两人同数：同数者 0</div>
          <div><span class="no">④</span>三人同数：全 0</div>
          <div><span class="no">⑤</span>领先者公开选，最高分胜</div>
        </div>
      </div>
    </div>
    <div class="fold" id="foldHist">
      <div class="foldhead">历史记录</div>
      <div class="foldbody">
        <div class="histtop">
          <table class="hist">
            <thead><tr><th>轮次</th><th>你</th><th>🔴AI</th><th>🔵AI</th></tr></thead>
          </table>
        </div>
        <div class="histscroll" id="histScroll">
          <table class="hist">
            <tbody id="histBody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
"use strict";
/* =====================================================================
 * 第 1 层：引擎层（纯函数，不碰界面、不碰 DOM、不碰全局状态）
 * ===================================================================== */

/* 结束概率表（按轮次区间）：3-6 轮 3%，7-10 轮 6%，11-15 轮 9%，
   16-20 轮 13%，21-24 轮 25%，第 25 轮必定结束（期望局长约 14.3 轮）。 */
const END_BANDS = [
  { from: 3,  to: 6,  p: 0.03 },
  { from: 7,  to: 10, p: 0.06 },
  { from: 11, to: 15, p: 0.09 },
  { from: 16, to: 20, p: 0.13 },
  { from: 21, to: 24, p: 0.25 }
];
const MAX_ROUND = 25;
const NO_ROLL_ROUNDS = 2; // 第 1、2 轮结束时不掷随机

/**
 * 算分：传入本轮三人的选择 [a,b,c]，返回三人各自得分 [s0,s1,s2]。
 *   1) 三人全不同 → 各得所选数字的分
 *   2) 有两人相同 → 这两人本轮 0 分，第三人正常得分
 *   3) 三人全同   → 三人全部 0 分
 * 实现上统一为：某数字被 ≥2 人选 → 选它的人得 0；否则得该数字。
 */
function scoreRound(choices) {
  const counts = {};
  for (const c of choices) counts[c] = (counts[c] || 0) + 1;
  return choices.map(c => (counts[c] >= 2 ? 0 : c));
}

/** 返回最高分者（领先者）的索引数组；并列则全部返回。 */
function getLeaders(players) {
  const max = Math.max(...players.map(p => p.score));
  const out = [];
  for (let i = 0; i < players.length; i++) if (players[i].score === max) out.push(i);
  return out;
}

/**
 * 本轮需要「公开选择」的玩家索引：
 *   - 第 1 轮特殊：所有人都不公开 → []
 *   - 从第 2 轮起：三人全部同分 → 没有明确最高分者 → []
 *   - 否则返回最高分者（1 人或 2 人并列最高）
 */
function getAnnouncers(players, round) {
  if (round <= 1) return [];
  const leaders = getLeaders(players);
  if (leaders.length === players.length) return [];   // 三人全部同分
  return leaders;
}

/** 返回第 round 轮结束时的结束概率（0~1）；1、2 轮与加赛轮返回 null（不掷随机）。 */
function endChance(round, isTiebreak) {
  if (isTiebreak) return null;
  if (round <= NO_ROLL_ROUNDS) return null;
  if (round >= MAX_ROUND) return 1;
  const band = END_BANDS.filter(b => round >= b.from && round <= b.to)[0];
  return band ? band.p : 1;
}

/** 本轮结束是否终止游戏。加赛轮不掷随机，必须打完 → 永远返回 false。 */
function shouldEnd(round, isTiebreak) {
  if (isTiebreak) return false;
  if (round <= NO_ROLL_ROUNDS) return false;
  if (round >= MAX_ROUND) return true;   // 第 25 轮必定结束
  return Math.random() < endChance(round, false);
}

/* =====================================================================
 * 第 2 层：AI 层（接口固定：aiChoose(meId, state) -> 1|2|3）
 * ===================================================================== */

/**
 * 第一版：纯随机。之后把这个函数体换掉即可，其它代码无需改动。
 * @param {number} meId  自己的座位号 0/1/2
 * @param {object} state 只读快照：{round,isTiebreak,phase,leaders,scores,publicChoices,secretChoices,isLeader,meId}
 *                       isLeader = meId 是否属于本轮「公开选择」的领先者
 * @returns {1|2|3}
 */
function aiChoose(meId, state) {
  return 1 + Math.floor(Math.random() * 3);
}

/* =====================================================================
 * 第 3 层：UI 层（只负责渲染与接收点击）
 * ===================================================================== */

const HUMAN = 0;
const wait = ms => new Promise(r => setTimeout(r, ms));
const $ = id => document.getElementById(id);

const els = {
  app: $('app'),
  hint: $('hint'), btns: $('btns'), histBody: $('histBody'), histScroll: $('histScroll'),
  slotMe: $('slotMe'), slotRed: $('slotRed'), slotBlue: $('slotBlue'),
  roundLabel: $('roundLabel'), restart: $('btnRestart')
};

/* ---- 状态机：announce → pick → reveal → (下一轮 | ended) ---- */
const G = {
  players: [
    { id: 0, name: '你',     score: 0, human: true  },
    { id: 1, name: '🔴AI',   score: 0, human: false, color: 'red'  },
    { id: 2, name: '🔵AI',   score: 0, human: false, color: 'blue' }
  ],
  phase: 'idle',          // idle | announce | pick | reveal | ended
  round: 0,
  isTiebreak: false,
  over: false,
  leaders: [],            // 本轮需要公开选择的玩家（第 1 轮 / 三人全同分 → 空）
  publicChoices: {},      // id -> number  领先者已提交的公开选择
  secretChoices: {},      // id -> number  暗选，亮牌前 UI 只渲染 "?"
  publicRevealed: false,  // 领先者的选择是否已「一起揭晓」
  pendingPublic: false,   // true = 轮到你公开选择
  pickStarted: false,     // 暗选阶段只允许进入一次（防重入）
  gains: null,            // 本轮三人得分
  winners: [],
  token: 0                // 重开时递增，用于取消未完成的异步流程
};

const cards = [];

/* ---------- 构建玩家卡（顺序：0 你 / 1 🔴 / 2 🔵） ---------- */
function buildCard(p, slotEl, extraClass) {
  const card = document.createElement('div');
  card.className = 'pcard' + (extraClass ? ' ' + extraClass : '');
  if (p.color) card.dataset.color = p.color;      // 数据结构里的 color 字段落到 DOM
  card.innerHTML =
    '<div class="bubble"></div>' +
    '<div class="pinfo"><div class="pname"></div><div class="pscore">0</div></div>' +
    '<div class="slot"><div class="flip">' +
      '<div class="face front">?</div>' +
      '<div class="face back"></div>' +
    '</div></div>' +
    '<div class="think"><i></i><i></i><i></i></div>';   /* 动画1 的容器，纯装饰 */
  const refs = {
    card,
    bubble: card.querySelector('.bubble'),
    name: card.querySelector('.pname'),
    flip: card.querySelector('.flip'),
    front: card.querySelector('.face.front'),
    back: card.querySelector('.face.back'),
    score: card.querySelector('.pscore')
  };
  refs.name.textContent = p.name;
  slotEl.appendChild(card);
  return refs;
}

const pickBtns = () => Array.from(els.btns.querySelectorAll('.pick'));
const humanCommitted = () => (G.publicChoices[HUMAN] != null ? G.publicChoices[HUMAN]
                          : G.secretChoices[HUMAN] != null ? G.secretChoices[HUMAN]
                          : null);

function snapshot(meId) {
  return {
    meId, round: G.round, isTiebreak: G.isTiebreak, phase: G.phase,
    leaders: G.leaders.slice(), isLeader: G.leaders.includes(meId),
    scores: G.players.map(p => p.score),
    publicChoices: Object.assign({}, G.publicChoices),
    secretChoices: Object.assign({}, G.secretChoices)
  };
}

function buzz(ms) { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} }

/* ---------- 历史记录：一行一轮，只记「谁选了什么」 ---------- */
function addHistoryRow(round, choices, isTiebreak) {
  const rows = els.histBody.children;
  if (rows.length) rows[rows.length - 1].classList.remove('new');
  const tr = document.createElement('tr');
  tr.className = 'new';                        // 新行从下方 8px 淡入，旧行自然上移
  tr.innerHTML = '<td>' + (isTiebreak ? '加赛' : round) + '</td>' +
    choices.map(c => '<td>' + c + '</td>').join('');
  els.histBody.appendChild(tr);
  // 平滑滚到底：最新一轮始终在最下面，旧的往上顶出视野
  const s = els.histScroll;
  if (s.scrollTo) s.scrollTo({ top: s.scrollHeight, behavior: 'smooth' });
  else s.scrollTop = s.scrollHeight;
}

/* ---------- 提示文字切换：淡出旧的、淡入新的，不跳变 ---------- */
function setHint(text, durMs) {
  if (els.hint.textContent === text) return;
  els.hint.textContent = text;
  els.hint.style.setProperty('--hint-dur', (durMs || 250) + 'ms');
  els.hint.classList.remove('swap');
  void els.hint.offsetWidth;                   // 重启 CSS 动画
  els.hint.classList.add('swap');
}

/* =====================================================================
 * 可选动效的独立函数：每个函数（连同对应 CSS 块）都可以整块删除，
 * 删掉后游戏流程与布局完全不受影响。它们只切 class，不参与任何判断。
 * ===================================================================== */

/* 动画1：思考中，可删除 ── i = 正在思考的玩家索引，null = 全部停下 */
function setThinking(i) {
  cards.forEach((c, k) => c.card.classList.toggle('thinking', k === i));
}

/* 动画1（暗选阶段的装饰链）：让几个 AI 依次"想一会儿"，纯装饰、不改任何选择 */
async function playThinking(list) {
  const t = G.token;
  for (const i of list) {
    if (t !== G.token || G.over || G.phase !== 'pick') return;
    setThinking(i);
    await wait(420);
    if (t !== G.token) return;
    setThinking(null);
  }
}

/* 动画2：公开选择后的张力，可删除 ── 非领先者卡片下沉 1px 再回位 */
function playSink() {
  cards.forEach((c, i) => { if (!G.leaders.includes(i)) c.card.classList.add('sink'); });
  setTimeout(() => cards.forEach(c => c.card.classList.remove('sink')), 800);
}

/* 动画3：亮牌前的呼吸，可删除 ── on=true 开始呼吸，亮牌时置 false */
function setTense(on) {
  els.app.classList.toggle('tense', !!on);
}

/* 动画5：领先者交换（权杖交接），可删除 ── 新的领先者延迟 0.15s 淡入 */
let prevLeadKey = '';
function playBaton(hi) {
  const key = hi.join(',');
  const changed = prevLeadKey !== '' && key !== prevLeadKey;
  prevLeadKey = key;
  if (!changed || G.over) return;
  cards.forEach((c, i) => c.card.classList.toggle('baton', hi.includes(i)));
  setTimeout(() => cards.forEach(c => c.card.classList.remove('baton')), 900);
}

/* 动画6：加赛轮下沉仪式，可删除 ── 无闪烁、无颜色 */
function playTieRitual() {
  els.app.classList.remove('tieritual');
  void els.app.offsetWidth;
  els.app.classList.add('tieritual');
  setTimeout(() => els.app.classList.remove('tieritual'), 700);
}

/* 动画7：结算时刻，可删除 ── 获胜方边框呼吸 2 次，落败方透明度略降 */
function playSettle() {
  cards.forEach((c, i) => {
    c.card.classList.toggle('winpulse', G.winners.includes(i));
    c.card.classList.toggle('lose', !G.winners.includes(i));
  });
  setTimeout(() => cards.forEach(c => c.card.classList.remove('winpulse')), 1400);
}

/* ===================== 可选动效函数到此结束 ===================== */

/* ---------- 渲染 ---------- */
function render() {
  // 当前轮数（纯白）
  els.roundLabel.textContent = G.over ? '已结束'
    : (G.isTiebreak ? '加赛轮' : '第 ' + G.round + ' 轮');

  const hi = G.over ? G.winners : G.leaders;   // 领先者 / 结束后最高分者
  G.players.forEach((pl, i) => {
    const c = cards[i];
    const isAnn = G.leaders.includes(i);
    const pub = G.publicChoices[i], sec = G.secretChoices[i];
    const revealing = G.phase === 'reveal';

    c.card.classList.toggle('lead', hi.includes(i));
    c.card.classList.toggle('zero', revealing && G.gains && G.gains[i] === 0);

    const sv = String(pl.score);
    if (c.score.textContent !== sv) {
      c.score.textContent = sv;
      c.score.classList.remove('pop'); void c.score.offsetWidth; c.score.classList.add('pop');
    }

    // 卡面三种状态：?（未提交） / 等待中…（已提交，等其他领先者） / 数字（已揭晓）
    let shown = null, waiting = false;
    if (revealing) shown = isAnn ? pub : sec;
    else if (isAnn && pub != null) { if (G.publicRevealed) shown = pub; else waiting = true; }

    c.front.textContent = waiting ? '等待中…' : '?';
    c.front.classList.toggle('txt', waiting);
    if (shown != null) { c.back.textContent = shown; c.flip.classList.add('revealed'); }

    // 对话气泡：只在公开选择「一起揭晓」之后出现
    if (isAnn && pub != null && G.publicRevealed) {
      c.bubble.textContent = '我选 ' + pub;
      c.bubble.classList.add('show');
    } else {
      c.bubble.classList.remove('show');
    }
  });

  // 按钮
  const canPublic = G.phase === 'announce' && !G.over && G.pendingPublic
    && G.leaders.includes(HUMAN) && G.publicChoices[HUMAN] == null;
  const canSecret = G.phase === 'pick' && !G.over && !G.gains
    && !G.leaders.includes(HUMAN) && G.secretChoices[HUMAN] == null;
  const enabled = canPublic || canSecret;
  const committed = humanCommitted();
  pickBtns().forEach(b => {
    b.disabled = !enabled;
    b.classList.toggle('sel', committed === Number(b.dataset.n) && !G.over);
  });

  // 提示文字：回合开始与游戏结束时淡入淡出，其余时刻直接切换（避免同时多处在动）
  els.hint.classList.toggle('dim', !enabled);
  setHint(hintText(enabled, canPublic), G.over ? 500 : (G.phase === 'announce' ? 250 : 0));

  playBaton(hi);            /* 动画5：领先者交换，可删除 */
}

/**
 * 四种提示：
 *   全同分轮（本轮无人公开，含第 1 轮）→ 本轮所有人暗选
 *   你是领先者                        → 你领先，请公开选择
 *   你是追赶者                        → 请暗选
 *   其余（对手提交中 / 你已锁定 / 亮牌中）→ 等待其他人…
 */
function hintText(enabled, canPublic) {
  if (G.over) {
    if (G.winners.length > 1) return '并列';
    return G.winners[0] === HUMAN ? '你赢了' : G.players[G.winners[0]].name + ' 获胜';
  }
  if (G.phase === 'idle') return '准备开始';
  if (enabled) {
    if (canPublic) return '你领先，请公开选择';
    return G.leaders.length === 0 ? '本轮所有人暗选' : '请暗选';
  }
  if (G.leaders.length === 0 && G.phase === 'announce') return '本轮所有人暗选';
  return '等待其他人…';
}

/* ---------- 单张卡复位（无动画） ---------- */
function resetCard(i) {
  const c = cards[i];
  c.flip.style.transition = 'none';
  c.flip.classList.remove('revealed');
  c.back.textContent = '';
  c.front.textContent = '?';
  c.front.classList.remove('txt');
  c.bubble.classList.remove('show');
  c.card.classList.remove('zero', 'lead');
  /* 可选动效的状态一并复位（删掉这些动效时这几行也无害） */
  c.card.classList.remove('thinking', 'sink', 'baton', 'winpulse', 'lose');
  void c.flip.offsetWidth;
  c.flip.style.transition = '';
}

/* ---------- 新局 ---------- */
function newGame() {
  G.token++;
  G.players.forEach(p => p.score = 0);
  G.round = 0; G.isTiebreak = false; G.over = false; G.phase = 'idle';
  G.leaders = []; G.publicChoices = {}; G.secretChoices = {};
  G.publicRevealed = false; G.pendingPublic = false; G.pickStarted = false;
  G.gains = null; G.winners = [];
  cards.forEach((_, i) => resetCard(i));
  els.histBody.innerHTML = '';
  render();
  const t = G.token;
  wait(420).then(() => { if (t === G.token) startRound(false); });
}

/* ---------- 轮次开始：announce ---------- */
async function startRound(isTiebreak) {
  const t = G.token;
  G.isTiebreak = !!isTiebreak;
  if (isTiebreak) playTieRitual();             /* 动画6：加赛轮下沉仪式，可删除 */
  G.round++;
  G.phase = 'announce';
  G.publicChoices = {}; G.secretChoices = {};
  G.publicRevealed = false; G.pendingPublic = false; G.pickStarted = false;
  G.gains = null;
  cards.forEach((_, i) => resetCard(i));
  // 引擎层：本轮需要公开选择的人（第 1 轮 / 三人全部同分 → 无人公开）
  G.leaders = getAnnouncers(G.players, G.round);
  render();

  // 无人公开：直接进入暗选
  if (!G.leaders.length) {
    await wait(300);
    if (t !== G.token) return;
    beginPickPhase();
    return;
  }

  // 领先者各自提交（提交完不显示，只显示「等待中…」）
  for (const i of G.leaders.filter(k => !G.players[k].human)) {
    setThinking(i);                            /* 动画1：思考中，可删除 */
    await wait(650);
    if (t !== G.token) return;
    setThinking(null);                         /* 动画1：可删除 */
    G.publicChoices[i] = aiChoose(i, snapshot(i));   // AI 层
    render();
    buzz(10);
  }

  // 轮到人类公开选择：交出按钮，等点击
  if (G.leaders.includes(HUMAN) && G.publicChoices[HUMAN] == null) {
    G.pendingPublic = true;
    render();
    return;
  }

  await announceReveal();
}

/** 所有领先者都提交完毕后，一起揭晓各自的选择（不先选先显示） */
async function announceReveal() {
  const t = G.token;
  G.pendingPublic = false;
  await wait(320);
  if (t !== G.token) return;
  G.publicRevealed = true;
  setTense(false);              /* 动画3：停止呼吸，三张卡同时翻牌（时间差 0），可删除 */
  render();                     // 领先者卡片同时翻开 + 气泡
  playSink();                   /* 动画2：追赶者卡片下沉 1px，可删除 */
  buzz(14);
  await wait(560);
  if (t !== G.token) return;
  beginPickPhase();
}

/* ---------- 暗选阶段：pick（带重入保护） ---------- */
function beginPickPhase() {
  if (G.pickStarted || G.over || G.phase === 'pick' || G.phase === 'reveal') return;
  G.pickStarted = true;
  G.pendingPublic = false;
  G.phase = 'pick';
  const nonLeaders = [0, 1, 2].filter(i => !G.leaders.includes(i));

  // 非领先者 AI 暗选（存入 secretChoices，UI 不显示）
  nonLeaders.forEach(i => {
    if (!G.players[i].human) G.secretChoices[i] = aiChoose(i, snapshot(i));   // AI 层
  });

  // 说明：下面两行是纯装饰，删掉不影响选择结果与流程
  setTense(true);                                       /* 动画3：亮牌前呼吸，可删除 */
  playThinking(nonLeaders.filter(k => !G.players[k].human));   /* 动画1：思考中，可删除 */

  render();
  if (nonLeaders.includes(HUMAN)) return;     // 等待玩家暗选

  const t = G.token;
  wait(900).then(() => { if (t === G.token) doReveal(); });
}

/* ---------- 点击处理 ---------- */
function onPick(n) {
  if (G.over) return;
  // 领先者公开选择
  if (G.phase === 'announce' && G.pendingPublic && G.publicChoices[HUMAN] == null) {
    G.pendingPublic = false;
    G.publicChoices[HUMAN] = n;
    render();                 // 你已提交 → 显示「等待中…」
    buzz(20);
    const t = G.token;
    wait(360).then(() => { if (t === G.token) announceReveal(); });
    return;
  }
  // 暗选
  if (G.phase === 'pick' && !G.gains && !G.leaders.includes(HUMAN) && G.secretChoices[HUMAN] == null) {
    G.secretChoices[HUMAN] = n;
    render();
    buzz(20);
    const t = G.token;
    wait(620).then(() => { if (t === G.token) doReveal(); });
  }
}

/* ---------- 亮牌：reveal ---------- */
async function doReveal() {
  if (G.phase === 'reveal' || G.over) return;   // 重入保护：一轮只亮一次
  const t = G.token;
  G.phase = 'reveal';
  setThinking(null);            /* 动画1：停下所有思考点，可删除 */
  setTense(false);              /* 动画3：停止呼吸，可删除 */

  // 领先者取公开选择，其余取暗选（兜底：缺值就用 AI 层补一个，避免卡死）
  const choices = [0, 1, 2].map(i => {
    const v = G.leaders.includes(i) ? G.publicChoices[i] : G.secretChoices[i];
    return v == null ? aiChoose(i, snapshot(i)) : v;
  });

  const gains = scoreRound(choices);   // 引擎层：纯函数
  G.gains = gains;
  render();                                    // ① 亮牌翻转 0.4s
  buzz(14);

  await wait(700);                             // 翻完轻微停顿
  if (t !== G.token) return;

  gains.forEach((g, i) => { G.players[i].score += g; });
  render();                                    // ② 分数淡入上浮 0.3s

  await wait(420);
  if (t !== G.token) return;
  addHistoryRow(G.round, choices, G.isTiebreak);   // ③ 历史新行滑入 0.3s

  await wait(520);
  if (t !== G.token) return;
  afterReveal();
}

/* ---------- 轮后判定 ---------- */
function afterReveal() {
  if (G.isTiebreak) { finishGame(); return; }        // 加赛轮不掷随机

  if (!shouldEnd(G.round, G.isTiebreak)) { nextRound(false); return; }
  if (getLeaders(G.players).length > 1) nextRound(true);   // 最高分并列 → 加赛一轮
  else finishGame();
}

function nextRound(tiebreak) {
  const t = G.token;
  render();
  wait(900).then(() => { if (t === G.token) startRound(!!tiebreak); });
}

function finishGame() {
  G.phase = 'ended';
  G.over = true;
  G.winners = getLeaders(G.players);   // 引擎层：纯函数
  render();
  playSettle();                        /* 动画7：结算时刻，可删除 */
  buzz([20, 40]);
}

/* ---------- 绑定事件 ---------- */
els.btns.addEventListener('click', e => {
  const b = e.target.closest('.pick');
  if (!b || b.disabled) return;
  onPick(Number(b.dataset.n));
});
els.restart.addEventListener('click', () => { buzz(15); newGame(); });

/* ---------- 启动 ---------- */
cards.push(buildCard(G.players[0], els.slotMe));
cards.push(buildCard(G.players[1], els.slotRed));
cards.push(buildCard(G.players[2], els.slotBlue));
render();
newGame();
</script>
</body>
</html>
